<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · Somm's Wine Bar</title>
<link rel="icon" href="/assets/img/favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baskervville:ital@0;1&family=Pinyon+Script&family=Prompt:wght@300;400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/site.css">
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js" defer></script>
</head>
<body class="admin">

<!-- LOGIN -->
<section class="login" data-view="login" hidden>
  <form class="login-card" data-login>
    <img src="/assets/img/logo-navy.png" alt="Somm's Wine Bar" width="200">
    <p class="eyebrow center">Painel do Diário de Adega</p>
    <label class="field"><span>Usuário</span><input name="user" autocomplete="username" required></label>
    <label class="field"><span>Senha</span><input name="pass" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-wine btn-block" type="submit">Entrar</button>
    <p class="form-msg" data-login-msg role="alert"></p>
    <a href="/" class="btn-text">← Voltar ao site</a>
  </form>
</section>

<!-- APP -->
<div class="app" data-view="app" hidden>
  <aside class="sidebar">
    <a href="/" class="sb-brand" target="_blank" rel="noopener"><img src="/assets/img/logo-cream.png" alt="Somm's Wine Bar"></a>
    <nav class="sb-nav">
      <a href="#/painel" data-route="painel"><svg viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z"/></svg>Visão geral</a>
      <a href="#/posts" data-route="posts"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></svg>Posts</a>
      <a href="#/novo" data-route="novo"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Novo post</a>
      <a href="#/leads" data-route="leads"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M21 20c0-2.6-1.6-4.9-4-5.7"/></svg>Leads</a>
      <a href="#/categorias" data-route="categorias"><svg viewBox="0 0 24 24"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>Categorias</a>
    </nav>
    <div class="sb-foot">
      <p data-user></p>
      <button class="btn-text" data-logout>Sair</button>
    </div>
  </aside>
  <main class="main" data-main></main>
</div>

<div class="admin-toast" data-toast hidden></div>
</body>
</html>
